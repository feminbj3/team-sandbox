name: SRE Production pipeline
on:
  push:
    branches: ["main"]
    paths-ignore: ["*.md", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        default: "staging"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeot-minutes: 10
    steps:
      -name: Checkout code
       uses: actions/checkout@v3      
      -name: Execute health and unit tests
       env: 
        APP_MODE: test
       run: |
        python3 -m unittest discover -s tests
        echo "Commit SHA is ${{ github.sha }}"