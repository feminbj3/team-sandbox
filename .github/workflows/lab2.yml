name: Docker build with Trivy scan
on: 
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-docker-image-and-trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Cover uppercase to lower
        id: owner
        shell: bash
        run: |
          echo "lc_owner=$(echo ${{github.repository_owner}} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Create the docker image with immbutable github SHA
        run: |
          docker build -t ghcr.io/${{ steps.owner.outputs.lc_owner }}/sre-app:${{ github.sha }} .
      - name: Scan the docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.lc_owner }}/sre-app:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
      - name: Authenticate to github container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the docker image to github container registry
        run: |
          docker push ghcr.io/${{ steps.owner.outputs.lc_owner }}/sre-app:${{ github.sha }}