
name: Docker build with Trivy scan

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-docker-image-and-trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert owner to lowercase
        id: owner
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "lc_owner=$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build Docker image with immutable Git SHA tag
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lc_owner }}/sre-app:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.lc_owner }}/sre-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to GHCR
        run: |
          docker push ghcr.io/${{ steps.owner.outputs.lc_owner }}/sre-app:${{ github.sha }}

      - name: Output Docker image tag
        run: |
          echo "Docker image tag: ghcr.io/${{ steps.owner.outputs.lc_owner }}/sre-app:${{ github.sha }}"

      - name: Save Docker image as a tar file
        run: |
          docker save \
            -o sre-app-${{ github.sha }}.tar \
            ghcr.io/${{ steps.owner.outputs.lc_owner }}/sre-app:${{ github.sha }}

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: sre-app-${{ github.sha }}
          path: sre-app-${{ github.sha }}.tar
          retention-days: 7
